# Eval 1 — Single Object Pick-and-Place (training config for SO101PlaceBowlCube-v1)
#
# Strategy: the spec allows BC for Eval 1, so this sim env is mainly used to
# pre-train an RL policy that can be optionally fine-tuned with DAgger or used
# as a sanity check for the wrist-camera + bowl pipeline.

env_id: SO101PlaceBowlCube-v1
num_envs: 1024
num_eval_envs: 16
total_timesteps: 1500000
buffer_size: 1000000
batch_size: 512
num_updates: 256
learning_starts: 5000

# SAC
policy_lr: 3e-4
q_lr: 3e-4
alpha_lr: 3e-4
alpha: 0.2
autotune: true
gamma: 0.9
tau: 0.01
num_q: 2
num_atoms: 101
v_min: -20.0
v_max: 20.0

# Rendering / observations
obs_mode: rgb+segmentation
render_size: 128
image_size: 16
apply_jitter: true

# Project-spec env kwargs
env_domain_randomization: true
control_mode: pd_joint_target_delta_pos

# Eval / logging
eval_freq: 100000
save_train_video_freq: null
capture_video: true
save_model: true
